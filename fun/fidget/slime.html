<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fbf4ec">
<title>슬라임 | 말랑 놀이터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/common.css">
</head>
<body class="play-page play-page--slime">
<div class="play">
  <header class="play__top">
    <a href="index.html" class="play__back" aria-label="목록으로">
      <svg class="play__back-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
    </a>
    <h1 class="play__title">슬라임</h1>
    <button type="button" class="play__btn play__btn--sound" aria-label="소리 끄기">🔊</button>
    <button type="button" class="play__btn play__btn--reset">다시 뭉치기</button>
  </header>
  <main class="play__stage">
    <canvas class="play__canvas"></canvas>
    <p class="play__hint">눌러서 당기면 쭈욱 · 꾹 오래 누르면 바풍!</p>
    <div class="play__colors">
      <button type="button" class="play__color play__color--pink is-active" data-color="pink" aria-label="핑크"></button>
      <button type="button" class="play__color play__color--mint" data-color="mint" aria-label="민트"></button>
      <button type="button" class="play__color play__color--lavender" data-color="lavender" aria-label="라벤더"></button>
      <button type="button" class="play__color play__color--sky" data-color="sky" aria-label="하늘"></button>
    </div>
  </main>
</div>
<script src="js/common.js"></script>
<script src="js/sound.js"></script>
<script src="js/slime.js"></script>
</body>
</html>
