<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#fbf6ff">
<title>말랑 놀이터</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="stylesheet" href="css/common.css">
</head>
<body class="list-page">
<div class="list">
  <header class="list__head">
    <h1 class="list__title">말랑 놀이터</h1>
    <p class="list__desc">누르고, 터트리고, 늘려보세요. 소리를 켜면 더 재밌어요 🔊</p>
  </header>
  <div class="list__grid">
    <a href="wakpu.html" class="card">
      <div class="card__thumb card__thumb--wakpu"><img src="images/wakpu.svg" alt="왁뿌볼" class="card__thumb-img"></div>
      <div class="card__body">
        <h2 class="card__name">왁뿌볼</h2>
        <p class="card__text">톡톡 두드려서 바삭한 왁스 껍질을 깨면 속에서 말랑이가 나와요.</p>
        <span class="card__tag">클릭 · 바삭바삭</span>
      </div>
    </a>
    <a href="bubble.html" class="card">
      <div class="card__thumb card__thumb--bubble"><img src="images/bubble.svg" alt="뽁뽁이" class="card__thumb-img"></div>
      <div class="card__body">
        <h2 class="card__name">뽁뽁이</h2>
        <p class="card__text">하나씩 톡! 꾹 누른 채로 쭉 문지르면 타타타닥 연속으로 터져요.</p>
        <span class="card__tag">클릭 · 드래그</span>
      </div>
    </a>
    <a href="slime.html" class="card">
      <div class="card__thumb card__thumb--slime"><img src="images/slime.svg" alt="슬라임" class="card__thumb-img"></div>
      <div class="card__body">
        <h2 class="card__name">슬라임</h2>
        <p class="card__text">꾹 누르면 손가락 자국이 남고, 바깥으로 당기면 쭈욱 늘어나요.</p>
        <span class="card__tag">누르기 · 늘리기</span>
      </div>
    </a>
  </div>
</div>
</body>
</html>
